name: Build iOS IPA – Ridingo Driver App

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build-ios:
    name: Build Unsigned IPA (Latest UI)
    runs-on: macos-latest

    steps:
      # ── 1. Checkout ────────────────────────────────────────────────
      - name: Checkout code
        uses: actions/checkout@v4

      # ── 2. Node.js setup ───────────────────────────────────────────
      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # ── 3. Install dependencies ────────────────────────────────────
      - name: Install npm dependencies
        run: npm ci

      # ── 4. Build web (Vite) — always fresh ────────────────────────
      - name: Build Vite web app (clean)
        run: |
          rm -rf dist
          npm run build
          echo "✅ Web build complete. dist/ size:"
          du -sh dist/

      # ── 5. Clean old iOS web assets, then Capacitor sync ──────────
      - name: Clean iOS public assets & Capacitor sync iOS
        run: |
          echo "🧹 Wiping stale iOS web assets..."
          rm -rf ios/App/App/public
          npx cap sync ios --deployment
          echo "✅ Capacitor sync done. New web assets:"
          ls -la ios/App/App/public/

      # ── 6. Force Bundle ID & Display Name in Info.plist ───────────
      - name: Set Bundle ID & Display Name (Driver App)
        run: |
          PLIST="ios/App/App/Info.plist"
          /usr/libexec/PlistBuddy -c "Set :CFBundleIdentifier com.ridingo.driver"   "$PLIST"
          /usr/libexec/PlistBuddy -c "Set :CFBundleDisplayName Ridingo Driver"      "$PLIST"
          /usr/libexec/PlistBuddy -c "Set :CFBundleName Ridingo Driver"             "$PLIST"
          echo "--- ✅ Info.plist verified ---"
          /usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier"  "$PLIST"
          /usr/libexec/PlistBuddy -c "Print :CFBundleDisplayName" "$PLIST"

      # ── 7. Select latest Xcode ────────────────────────────────────
      - name: Select Xcode
        run: sudo xcode-select -switch /Applications/Xcode.app

      # ── 8. Resolve Swift Package Manager deps ─────────────────────
      - name: Resolve SPM packages
        run: |
          xcodebuild -resolvePackageDependencies \
            -workspace ios/App/App.xcworkspace \
            -scheme App

      # ── 9. Build .app (no signing) ────────────────────────────────
      - name: Build .app (CODE_SIGNING_ALLOWED=NO)
        run: |
          xcodebuild \
            -workspace ios/App/App.xcworkspace \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath DerivedData \
            PRODUCT_BUNDLE_IDENTIFIER="com.ridingo.driver" \
            PRODUCT_NAME="Ridingo Driver" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            ENABLE_BITCODE=NO

      # ── 10. Package into unsigned IPA ─────────────────────────────
      - name: Package unsigned IPA
        run: |
          APP_PATH=$(find DerivedData -name "*.app" -path "*/Release-iphoneos/*" | head -1)
          echo "Found .app at: $APP_PATH"
          mkdir -p Payload
          cp -r "$APP_PATH" Payload/
          zip -r Ridingo-DriverApp-unsigned.ipa Payload
          ls -lh Ridingo-DriverApp-unsigned.ipa

      # ── 11. Upload IPA as artifact ────────────────────────────────
      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: Ridingo-DriverApp-IPA
          path: Ridingo-DriverApp-unsigned.ipa
          retention-days: 30
